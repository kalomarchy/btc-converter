<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Converter Versions</title>
    <style>
        :root {
            --bg: #dbeafe;
            --card: #eff6ff;
            --card-border: #93c5fd;
            --text: #ffffff;
            --muted: #dbeafe;
            --accent: #39ff14;
            --accent-2: #7dd3fc;
            --button-bg: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            color: var(--text);
            min-height: 100vh;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px 48px;
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;
            font-size: clamp(2rem, 3vw, 3rem);
        }

        .subtitle {
            text-align: center;
            color: #ffffff;
            margin-bottom: 24px;
            font-size: 1rem;
        }

        .switcher {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0 auto 24px;
            max-width: 760px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(147, 197, 253, 0.8);
            border-radius: 18px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
        }

        .switch-btn {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 150px;
        }

        .switch-btn:hover {
            color: #ffffff;
            border-color: rgba(147, 197, 253, 0.8);
            background: rgba(255, 255, 255, 0.12);
        }

        .switch-btn.active {
            background: linear-gradient(180deg, rgba(57, 255, 20, 0.28), rgba(57, 255, 20, 0.12));
            border-color: rgba(57, 255, 20, 0.9);
            color: #0c8a00;
            box-shadow: 0 0 0 1px rgba(57, 255, 20, 0.25), 0 0 14px rgba(57, 255, 20, 0.2);
        }

        .viewer {
            background: rgba(239, 246, 255, 0.97);
            border: 1px solid rgba(147, 197, 253, 0.9);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 24px 50px rgba(96, 165, 250, 0.25);
        }

        .viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid rgba(147, 197, 253, 0.8);
            background: linear-gradient(135deg, #dbeafe 0%, #e0f2fe 100%);
        }

        .viewer-header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #ffffff;
        }

        .tag {
            background: rgba(57, 255, 20, 0.15);
            color: #0c8a00;
            border: 1px solid rgba(57, 255, 20, 0.7);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.25);
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        iframe {
            width: 100%;
            height: 780px;
            border: 0;
            background: #0b1120;
            display: block;
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>BTC Converter Versions</h1>
        <p class="subtitle">Switch between the three converter versions using the buttons below.</p>

        <div class="switcher" id="switcher">
            <button class="switch-btn active" data-version="/converterV0.0.1.html">Version 0.0.1</button>
            <button class="switch-btn" data-version="/converterV0.0.2.html">Version 0.0.2</button>
            <button class="switch-btn" data-version="/converterV0.0.3.html">Version 0.0.3</button>
        </div>

        <div class="viewer">
            <div class="viewer-header">
                <h2 id="viewer-title">Version 0.0.1</h2>
                <span class="tag" id="viewer-tag">Original</span>
            </div>
            <iframe id="viewer-frame" src="/converterV0.0.1.html" title="BTC Converter Version 0.0.1"></iframe>
        </div>
    </div>

    <script>
        const buttons = document.querySelectorAll('.switch-btn');
        const frame = document.getElementById('viewer-frame');
        const title = document.getElementById('viewer-title');
        const tag = document.getElementById('viewer-tag');

        const versions = {
            '/converterV0.0.1.html': { title: 'Version 0.0.1', tag: 'Original' },
            '/converterV0.0.2.html': { title: 'Version 0.0.2', tag: 'Improved' },
            '/converterV0.0.3.html': { title: 'Version 0.0.3', tag: 'Latest' }
        };

        buttons.forEach((button) => {
            button.addEventListener('click', () => {
                const version = button.dataset.version;
                frame.src = version;
                frame.title = versions[version].title;
                title.textContent = versions[version].title;
                tag.textContent = versions[version].tag;

                buttons.forEach((btn) => btn.classList.toggle('active', btn === button));
            });
        });
    </script>
</body>
</html>
